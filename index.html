<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendly Quick Book</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --ink: #1c1b18;
    --muted: #6d695f;
    --line: #d9d3c4;
    --accent: #0b5cff;
    --accent-ink: #ffffff;
    --warn: #a33a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --card: #1e1d1a;
      --ink: #f1eee6;
      --muted: #a09b8e;
      --line: #36342e;
      --accent: #5b8dff;
      --accent-ink: #0c1020;
      --warn: #ffab7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="email"], input[type="url"], input[type="time"] {
    width: 100%;
    padding: 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    width: 100%;
    padding: 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #detailsEdit, #detailsView { margin-top: 14px; }
  .saved {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .saved-text { min-width: 0; }
  .saved-name { font-weight: 600; overflow-wrap: anywhere; }
  .saved-email { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  button.small {
    flex: none;
    padding: 9px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .days button {
    padding: 10px 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .days button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .resolved {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .resolved strong { color: var(--ink); }
  a.go {
    display: block;
    text-align: center;
    padding: 15px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 17px;
    text-decoration: none;
  }
  a.go[aria-disabled="true"] {
    background: var(--line);
    color: var(--muted);
    pointer-events: none;
  }
  .missing { margin: 10px 0 0; font-size: 14px; color: var(--warn); min-height: 20px; }
  .url {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    word-break: break-all;
  }
  button.copy:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
  button.copy {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Calendly Quick Book</h1>
  <p class="sub">Fill once, pick a day and hour, open the booking form ready to submit.</p>

  <div class="card">
    <label for="link">Calendly event link</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://calendly.com/user/30min">

    <div id="detailsEdit">
      <label for="name">Name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Your full name">

      <label for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="you@example.com">

      <button class="copy" id="saveDetails" type="button">Save details</button>
    </div>

    <div id="detailsView" hidden>
      <label id="detailsLabel">Your details</label>
      <div class="saved" role="group" aria-labelledby="detailsLabel">
        <div class="saved-text">
          <div class="saved-name" id="savedName"></div>
          <div class="saved-email" id="savedEmail"></div>
        </div>
        <button class="small" id="editDetails" type="button">Edit</button>
      </div>
    </div>
  </div>

  <div class="card">
    <label id="dayLabel">Day</label>
    <div class="days" id="days" role="group" aria-labelledby="dayLabel"></div>

    <label for="time">Hour</label>
    <select id="time"></select>

    <div class="resolved" id="resolved"></div>
  </div>

  <div class="card">
    <a class="go" id="go" href="#" aria-disabled="true">Open in Calendly</a>
    <p class="missing" id="missing" role="status"></p>
    <div class="url" id="url" hidden></div>
    <button class="copy" id="copy" type="button" hidden>Copy link</button>
  </div>
</main>

<script>
(function () {
  var DAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  var STORE_KEY = "calendly-quick-book";

  var el = {
    link: document.getElementById("link"),
    name: document.getElementById("name"),
    email: document.getElementById("email"),
    days: document.getElementById("days"),
    time: document.getElementById("time"),
    resolved: document.getElementById("resolved"),
    go: document.getElementById("go"),
    missing: document.getElementById("missing"),
    url: document.getElementById("url"),
    copy: document.getElementById("copy"),
    detailsEdit: document.getElementById("detailsEdit"),
    detailsView: document.getElementById("detailsView"),
    savedName: document.getElementById("savedName"),
    savedEmail: document.getElementById("savedEmail"),
    saveDetails: document.getElementById("saveDetails"),
    editDetails: document.getElementById("editDetails")
  };

  var state = { link: "", name: "", email: "", day: null, time: "" };

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (saved && typeof saved === "object") {
        ["link", "name", "email"].forEach(function (k) {
          if (typeof saved[k] === "string") state[k] = saved[k];
        });
        // Whole hours only: an older saved value with minutes is rounded down.
        if (typeof saved.time === "string") {
          var hour = parseInt(saved.time.split(":")[0], 10);
          if (!isNaN(hour) && hour >= 0 && hour <= 23) state.time = pad(hour) + ":00";
        }
        if (typeof saved.day === "number" && saved.day >= 0 && saved.day <= 6) state.day = saved.day;
      }
    } catch (e) {}
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function validEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
  }

  function detailsComplete() {
    return state.name.trim() !== "" && validEmail(state.email);
  }

  // Name and email show as a saved summary with an Edit button once both are valid.
  var editingDetails = true;

  function renderDetails() {
    el.detailsEdit.hidden = !editingDetails;
    el.detailsView.hidden = editingDetails;
    el.savedName.textContent = state.name.trim();
    el.savedEmail.textContent = state.email.trim();
    el.saveDetails.disabled = !detailsComplete();
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Next occurrence of the chosen weekday at the chosen time, in this device's time zone.
  // Today counts only if the time has not passed yet.
  function resolveDate(day, time) {
    var parts = time.split(":");
    var h = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    var now = new Date();
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    var diff = (day - now.getDay() + 7) % 7;
    if (diff === 0 && target.getTime() <= now.getTime()) diff = 7;
    target.setDate(target.getDate() + diff);
    return target;
  }

  function offsetString(date) {
    var mins = -date.getTimezoneOffset();
    var sign = mins >= 0 ? "+" : "-";
    mins = Math.abs(mins);
    return sign + pad(Math.floor(mins / 60)) + ":" + pad(mins % 60);
  }

  // Accepts https://calendly.com/user/event (query and trailing slash are dropped).
  function cleanLink(raw) {
    var value = raw.trim();
    if (!value) return null;
    if (!/^https?:\/\//i.test(value)) value = "https://" + value;
    var u;
    try { u = new URL(value); } catch (e) { return null; }
    var host = u.hostname.toLowerCase().replace(/^www\./, "");
    if (host !== "calendly.com") return null;
    var path = u.pathname.replace(/\/+$/, "");
    if (path.split("/").filter(Boolean).length < 2) return null;
    return "https://calendly.com" + path;
  }

  function build() {
    var missing = [];
    var base = cleanLink(state.link);
    if (!base) missing.push("a calendly.com event link (user/event)");
    if (!state.name.trim()) missing.push("name");
    if (!validEmail(state.email)) missing.push("email");
    if (state.day === null) missing.push("day");
    if (!state.time) missing.push("hour");

    var target = (state.day !== null && state.time) ? resolveDate(state.day, state.time) : null;

    if (target) {
      var pretty = target.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      var prettyTime = target.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      el.resolved.innerHTML = "";
      el.resolved.appendChild(document.createTextNode("Books "));
      var strong = document.createElement("strong");
      strong.textContent = pretty + ", " + prettyTime;
      el.resolved.appendChild(strong);
      el.resolved.appendChild(document.createTextNode(" (UTC" + offsetString(target) + ")"));
    } else {
      el.resolved.textContent = "Pick a day and hour to see the exact date.";
    }

    if (missing.length || !target) {
      el.go.setAttribute("aria-disabled", "true");
      el.go.setAttribute("href", "#");
      el.missing.textContent = "Still needed: " + missing.join(", ") + ".";
      el.url.hidden = true;
      el.copy.hidden = true;
      return;
    }

    var ymd = target.getFullYear() + "-" + pad(target.getMonth() + 1) + "-" + pad(target.getDate());
    var stamp = ymd + "T" + pad(target.getHours()) + ":" + pad(target.getMinutes()) + ":00" + offsetString(target);
    var query = [
      "name=" + encodeURIComponent(state.name.trim()),
      "email=" + encodeURIComponent(state.email.trim()),
      "month=" + ymd.slice(0, 7),
      "date=" + ymd
    ].join("&");
    var full = base + "/" + stamp + "?" + query;

    el.go.setAttribute("href", full);
    el.go.setAttribute("aria-disabled", "false");
    el.missing.textContent = "";
    el.url.textContent = full;
    el.url.hidden = false;
    el.copy.hidden = false;
    el.copy.textContent = "Copy link";
  }

  function renderDays() {
    el.days.innerHTML = "";
    DAY_ORDER.forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = DAY_SHORT[d];
      b.setAttribute("aria-pressed", String(state.day === d));
      b.addEventListener("click", function () {
        state.day = d;
        renderDays();
        save();
        build();
      });
      el.days.appendChild(b);
    });
  }

  function renderHours() {
    var first = document.createElement("option");
    first.value = "";
    first.textContent = "Select hour";
    el.time.appendChild(first);
    for (var h = 0; h < 24; h++) {
      var o = document.createElement("option");
      o.value = pad(h) + ":00";
      o.textContent = new Date(2000, 0, 1, h, 0).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      el.time.appendChild(o);
    }
  }

  ["link", "name", "email", "time"].forEach(function (k) {
    function onChange() {
      state[k] = el[k].value;
      save();
      renderDetails();
      build();
    }
    el[k].addEventListener("input", onChange);
    el[k].addEventListener("change", onChange);
  });

  el.saveDetails.addEventListener("click", function () {
    if (!detailsComplete()) return;
    editingDetails = false;
    renderDetails();
  });

  el.editDetails.addEventListener("click", function () {
    editingDetails = true;
    renderDetails();
    try { el.name.focus(); } catch (e) {}
  });

  el.copy.addEventListener("click", function () {
    var text = el.url.textContent;
    try {
      navigator.clipboard.writeText(text).then(function () {
        el.copy.textContent = "Copied";
      }, function () {
        el.copy.textContent = "Copy blocked: select the link above";
      });
    } catch (e) {
      el.copy.textContent = "Copy blocked: select the link above";
    }
  });

  load();
  renderHours();
  el.link.value = state.link;
  el.name.value = state.name;
  el.email.value = state.email;
  el.time.value = state.time;
  editingDetails = !detailsComplete();
  renderDetails();
  renderDays();
  build();
})();
</script>
</body>
</html>
